syntax = "proto3";

package jpttm.gesture_action;

// One slot's assignment. behavior_id is a ZMK behavior local ID; 0 means the
// slot has nothing stored and falls back to its devicetree default.
message Action {
    uint32 slot = 1;
    uint32 behavior_id = 2;
    uint32 param1 = 3;
    uint32 param2 = 4;
}

// Paged, because the whole slot table does not fit in one RPC response on a
// build with modest ZMK_STUDIO_RPC_TX_BUF_SIZE. Ask for a window; repeat until
// start_slot + returned count reaches total_slots.
message GetActionsRequest {
    uint32 start_slot = 1;
}

message GetActionsResponse {
    uint32 total_slots = 1;
    uint32 start_slot = 2;
    repeated Action actions = 3;
}

// The compile-time fallback for each slot. Static, so a client reads it once
// and can then show what an unassigned slot will actually do instead of just
// calling it "default".
message GetDefaultsRequest {
    uint32 start_slot = 1;
}

message GetDefaultsResponse {
    uint32 total_slots = 1;
    uint32 start_slot = 2;
    repeated Action actions = 3;
}

message SetActionRequest {
    Action action = 1;
    // Leave false to try a binding out without spending a flash write.
    bool persist = 2;
}

message SetActionResponse {
    bool success = 1;
}

// Drops the stored assignment so the slot returns to its devicetree default.
message ResetActionRequest {
    uint32 slot = 1;
    bool persist = 2;
}

message ResetActionResponse {
    bool success = 1;
}

// Human-readable label per slot, straight from the devicetree, so a UI can say
// "Layer 7 up" instead of "slot 0". Paged like GetActions. Names never change
// at runtime, so a client only needs to read them once per connection.
message GetSlotNamesRequest {
    uint32 start_slot = 1;
}

message GetSlotNamesResponse {
    uint32 total_slots = 1;
    uint32 start_slot = 2;
    repeated string names = 3;
}

// A gesture group: one mouse-gesture processor instance, owning a run of
// slots, plus the layers it currently acts on. Editing active_layers is what
// moves a whole set of gestures from one layer to another without a rebuild.
message Group {
    uint32 index = 1;
    string name = 2;
    uint32 active_layers = 3;
}

message GetGroupsRequest {}

message GetGroupsResponse {
    repeated Group groups = 1;
}

message SetGroupLayersRequest {
    uint32 index = 1;
    uint32 active_layers = 2;
    bool persist = 3;
}

message SetGroupLayersResponse {
    bool success = 1;
}

message Request {
    oneof request_type {
        GetActionsRequest get_actions = 1;
        SetActionRequest set_action = 2;
        ResetActionRequest reset_action = 3;
        GetSlotNamesRequest get_slot_names = 4;
        GetGroupsRequest get_groups = 5;
        SetGroupLayersRequest set_group_layers = 6;
        GetDefaultsRequest get_defaults = 7;
    }
}

message ErrorResponse {
    string message = 1;
}

message Response {
    oneof response_type {
        ErrorResponse error = 1;
        GetActionsResponse get_actions = 2;
        SetActionResponse set_action = 3;
        ResetActionResponse reset_action = 4;
        GetSlotNamesResponse get_slot_names = 5;
        GetGroupsResponse get_groups = 6;
        SetGroupLayersResponse set_group_layers = 7;
        GetDefaultsResponse get_defaults = 8;
    }
}
