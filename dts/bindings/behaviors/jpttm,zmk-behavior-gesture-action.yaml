description: |
  Behaviour whose target binding is held in settings and can be reassigned at
  runtime. Takes a slot number as its parameter.

  Slots with no stored value fall back to the entry at the same index in
  default-bindings, so a freshly flashed board behaves usefully before it is
  ever configured.

compatible: "jpttm,zmk-behavior-gesture-action"

include: one_param.yaml

properties:
  default-bindings:
    type: phandle-array
    # Without this, devicetree derives "#default-binding-cells" from the
    # property name and rejects every behaviour, which only declares
    # "#binding-cells".
    specifier-space: binding
    description: |
      Compile-time fallback for each slot, in slot order. Entry 0 is the
      fallback for slot 0, and so on. May be shorter than
      ZMK_GESTURE_ACTION_COUNT; slots past the end simply do nothing until
      assigned.

  slot-names:
    type: string-array
    description: |
      Label for each slot, in slot order, shown by configuration UIs in place of
      a bare number. Keep them short - they are carried over RPC with a 24-byte
      cap. May be shorter than the slot count; unnamed slots fall back to their
      number.

  reserved-layers:
    type: array
    description: |
      Layers this keyboard wants kept for ordinary use, which a configuration
      UI should therefore not offer as a target for gestures. Give the layer
      numbers, not a bitmask.

      A layer with gestures on it loses ordinary cursor movement, so a board
      whose base and pointing layers are fixed by design should say so here
      rather than leave a user to find out.

      This is for policy only, and it is the whole of what you need to write.
      Layers that *cannot* work are found automatically: every input listener
      in the tree is walked, and any layer claimed by an override that does not
      set process-next is reserved too, because an override returns before the
      base chain a gesture processor sits in. That means moving a scroll layer
      needs no edit here.

      Omit it and no layer is reserved on policy grounds.

  display-name:
    type: string
